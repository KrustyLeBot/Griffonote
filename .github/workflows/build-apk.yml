# Do not rename this file: GitHub numbers runs per workflow file and the run number is the app build number.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Pull requests: build only, with the default debug key; no secrets, nothing published.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
      - run: ./gradlew testDebugUnitTest assembleRelease --console=plain

  # Pushes to main (and manual runs): signed build + "latest" release.
  apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release # secrets only readable from main
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Decode signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease --console=plain 2>&1 | tee build.log

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Stage the APK
        run: cp app/build/outputs/apk/release/app-release.apk griffonote.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: griffonote-android
          path: griffonote.apk
          retention-days: 7

  # Windows client: tests, then a single-file exe (every event, nothing published here).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Stamp the build number (same as the Android version code)
        shell: bash
        run: echo "BUILD = ${{ github.run_number }}" > griffonote_win/_version.py
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Build the exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Griffonote
          --icon griffonote_win/assets/icon.ico
          --add-data "griffonote_win/assets;griffonote_win/assets"
          run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: griffonote-windows
          path: windows/dist/Griffonote.exe
          retention-days: 7

  # One "latest" release carrying both apps, published only when both builds succeeded.
  release:
    needs: [apk, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: Publish the "latest" release
        shell: bash
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/griffonote-android/griffonote.apk dist/griffonote-windows/Griffonote.exe \
            --title "Griffonote build ${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} of commit ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --latest
